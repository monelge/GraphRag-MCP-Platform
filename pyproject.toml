[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-rag-mcp"
version = "0.1.0"
description = "Graph-based RAG with MCP v2 integration"
authors = [{ name = "Team", email = "dev@example.com" }]
requires-python = ">=3.10"
dependencies = [
  "mcp==1.6.0",
  "qdrant-client>=1.9.0,<2.0.0",
  "tree-sitter>=0.23",
  "tree-sitter-python",
  "tree-sitter-typescript",
  "tree-sitter-c-sharp",
  "fastembed==0.8.0",
  "openai==1.3.9",
  "httpx<0.28",
  "python-dotenv",
  "rich",
  "redis>=5.0.0",
  "asyncpg>=0.29.0",
  "neo4j==5.13.0",
  "pydantic>=2.7.2,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
  "mypy>=1.5.0",
  "black>=23.0.0",
]
test = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=html --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
