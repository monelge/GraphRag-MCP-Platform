services:

  # ── Graph Database (Neo4j) ────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: graph-mcp-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - TZ=Europe/Istanbul
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_trigger_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_dbms_memory_transaction_total_max=512m
    volumes:
      - ${HOST_APP_ROOT}/data/neo4j/data:/data
      - ${HOST_APP_ROOT}/data/neo4j/logs:/logs
      - ${HOST_APP_ROOT}/data/neo4j/import:/var/lib/neo4j/import
      - ${HOST_APP_ROOT}/data/neo4j/plugins:/plugins
    networks:
      - graphmcp-net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Vektör Veritabanı ─────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: graph-mcp-qdrant
    restart: unless-stopped
    environment:
      - TZ=Europe/Istanbul
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ${HOST_APP_ROOT}/data/qdrant:/qdrant/storage
    networks:
      - graphmcp-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Embedding + Retrieval Cache ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: graph-mcp-redis
    restart: unless-stopped
    environment:
      - TZ=Europe/Istanbul
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ${HOST_APP_ROOT}/data/redis:/data
    networks:
      - graphmcp-net
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Retrieval Logs (privacy-safe) ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: graph-mcp-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - TZ=Europe/Istanbul
      - POSTGRES_USER=graphmcp
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=graphmcp
    volumes:
      - ${HOST_APP_ROOT}/data/postgres:/var/lib/postgresql/data
    networks:
      - graphmcp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphmcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── GraphMCP Sunucusu ─────────────────────────────────────────────────────
  graph-mcp:
    build: .
    container_name: graph-mcp
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      - graphmcp-net
    environment:
      - TZ=Europe/Istanbul
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=
      - REDIS_URL=redis://redis:6379
      - POSTGRES_DSN=postgresql://graphmcp:${POSTGRES_PASSWORD}@postgres:5432/graphmcp
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - COLLECTION_NAME=${COLLECTION_NAME:-codebase}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_FILE=/app/data/graph-mcp.log
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1536}
      - DEFAULT_COLLECTION=${DEFAULT_COLLECTION:-WareLogisticcBYS}
      - ANALYSIS_MODEL=${ANALYSIS_MODEL:-mistralai/mistral-nemo}
      - BUDGET_MODEL=${BUDGET_MODEL:-mistralai/mistral-nemo}
      - REASONING_MODEL=${REASONING_MODEL:-google/gemini-2.5-flash}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-mistralai/mistral-nemo}
      - HOST_PROJECTS_ROOT=${HOST_PROJECTS_ROOT:-/Volumes/MacBook/RiderProjects}
      - CONTAINER_PROJECTS_ROOT=${CONTAINER_PROJECTS_ROOT:-/projects}
      - PATH_MAPPINGS=${PATH_MAPPINGS}
      - MCP_TRANSPORT=sse
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - PROJECT_REGISTRY_PATH=/app/data/project_registry.json
      # OrbStack proxy'sini koru (dış API erişimi için) — ama NO_PROXY'deki
      # IPv6 CIDR'ı (fd07:b51a:cc66:f0::/64) httpx çökertiyor, temizlendi.
      # Docker iç servis hostname'leri de proxy'den muaf tutuldu.
      - NO_PROXY=localhost,127.0.0.1,127.0.0.0/8,::1,192.168.0.0/16,10.0.0.0/8,qdrant,neo4j,redis,postgres,graph-mcp-qdrant,graph-mcp-neo4j,graph-mcp-redis,graph-mcp-postgres
      - no_proxy=localhost,127.0.0.1,127.0.0.0/8,::1,192.168.0.0/16,10.0.0.0/8,qdrant,neo4j,redis,postgres,graph-mcp-qdrant,graph-mcp-neo4j,graph-mcp-redis,graph-mcp-postgres
    volumes:
      - ${HOST_PROJECTS_ROOT}:${CONTAINER_PROJECTS_ROOT}:ro
      - ${HOST_APP_ROOT}/src:/app/src
      - ${HOST_APP_ROOT}/scripts:/app/scripts
      - ${HOST_APP_ROOT}/data/graphmcp:/app/data
    entrypoint: ["python3", "-m", "src.mcp_server"]

  # ── Agent API (TDAD Orchestration) ──────────────────────────────────────────
  agent-api:
    build: .
    container_name: graph-mcp-agent-api
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:8001:8001"
    networks:
      - graphmcp-net
    environment:
      - TZ=Europe/Istanbul
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://graphmcp:${POSTGRES_PASSWORD}@postgres:5432/graphmcp
      - POSTGRES_DSN=postgresql://graphmcp:${POSTGRES_PASSWORD}@postgres:5432/graphmcp
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - DEFAULT_COLLECTION=${DEFAULT_COLLECTION:-WareLogisticcBYS}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_FILE=/app/data/agent-api.log
      # Complexity Router
      - COMPLEXITY_ROUTER_ENABLED=${COMPLEXITY_ROUTER_ENABLED:-true}
      - TIER_LOCAL_ENABLED=${TIER_LOCAL_ENABLED:-false}
      - TIER_LOCAL_MODEL=${TIER_LOCAL_MODEL:-qwen2.5-coder:32b}
      - TIER_LOCAL_BASE_URL=${TIER_LOCAL_BASE_URL:-http://host.docker.internal:11434/v1}
      - TIER_CHEAP_MODEL=${TIER_CHEAP_MODEL:-google/gemini-2.5-flash}
      - TIER_REASON_MODEL=${TIER_REASON_MODEL:-anthropic/claude-sonnet-4-6}
      - CONTEXT_BUDGET_LOCAL=${CONTEXT_BUDGET_LOCAL:-8000}
      - CONTEXT_BUDGET_CHEAP=${CONTEXT_BUDGET_CHEAP:-16000}
      - CONTEXT_BUDGET_REASON=${CONTEXT_BUDGET_REASON:-32000}
      # TDAD
      - HITL_TIMEOUT_SECONDS=${HITL_TIMEOUT_SECONDS:-300}
      - CODEACT_MAX_REFLECTIONS=${CODEACT_MAX_REFLECTIONS:-5}
      - VERIFY_TIMEOUT_SECONDS=${VERIFY_TIMEOUT_SECONDS:-120}
      - SESSION_CONTEXT_TTL_SECONDS=${SESSION_CONTEXT_TTL_SECONDS:-3600}
      # Workspace
      - WORKSPACE_BASE_PATH=${WORKSPACE_BASE_PATH:-/var/lib/graphrag/workspaces}
      - SNAPSHOT_RETENTION_HOURS=${SNAPSHOT_RETENTION_HOURS:-24}
      - MAX_SNAPSHOTS_PER_PROJECT=${MAX_SNAPSHOTS_PER_PROJECT:-20}
      # Feature flags
      - PATCH_MEMORY_ENABLED=false
      - SEMANTIC_DIFF_ENABLED=false
      - HOST_PROJECTS_ROOT=${HOST_PROJECTS_ROOT:-/Volumes/MacBook/RiderProjects}
      - CONTAINER_PROJECTS_ROOT=${CONTAINER_PROJECTS_ROOT:-/projects}
      - NO_PROXY=localhost,127.0.0.1,qdrant,neo4j,redis,postgres,graph-mcp
      - no_proxy=localhost,127.0.0.1,qdrant,neo4j,redis,postgres,graph-mcp
    volumes:
      - ${HOST_PROJECTS_ROOT}:${CONTAINER_PROJECTS_ROOT}:ro
      - ${HOST_APP_ROOT}/src:/app/src
      - ${HOST_APP_ROOT}/data/graphmcp:/app/data
      - agent-workspaces:/var/lib/graphrag/workspaces
    entrypoint: ["python3", "-m", "uvicorn", "src.agent.api:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── OpenAI API Gateway Bridge ──────────────────────────────────────────────
  openai-bridge:
    build: .
    container_name: graph-mcp-openai-bridge
    restart: unless-stopped
    ports:
      - "5555:5555"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - graphmcp-net
    environment:
      - TZ=Europe/Istanbul
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=
      - REDIS_URL=redis://redis:6379
      - POSTGRES_DSN=postgresql://graphmcp:${POSTGRES_PASSWORD}@postgres:5432/graphmcp
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - COLLECTION_NAME=${COLLECTION_NAME:-codebase}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_FILE=/app/data/openai-bridge.log
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1536}
      - DEFAULT_COLLECTION=${DEFAULT_COLLECTION:-WareLogisticcBYS}
      - ANALYSIS_MODEL=${ANALYSIS_MODEL:-mistralai/mistral-nemo}
      - BUDGET_MODEL=${BUDGET_MODEL:-mistralai/mistral-nemo}
      - REASONING_MODEL=${REASONING_MODEL:-google/gemini-2.5-flash}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-mistralai/mistral-nemo}
      - PROJECT_REGISTRY_PATH=/app/data/project_registry.json
      - NO_PROXY=localhost,127.0.0.1,127.0.0.0/8,::1,192.168.0.0/16,10.0.0.0/8,qdrant,neo4j,redis,postgres,graph-mcp-qdrant,graph-mcp-neo4j,graph-mcp-redis,graph-mcp-postgres
      - no_proxy=localhost,127.0.0.1,127.0.0.0/8,::1,192.168.0.0/16,10.0.0.0/8,qdrant,neo4j,redis,postgres,graph-mcp-qdrant,graph-mcp-neo4j,graph-mcp-redis,graph-mcp-postgres
    volumes:
      - ${HOST_PROJECTS_ROOT}:${CONTAINER_PROJECTS_ROOT}:ro
      - ${HOST_APP_ROOT}/src:/app/src
      - ${HOST_APP_ROOT}/scripts:/app/scripts
      - ${HOST_APP_ROOT}/data/graphmcp:/app/data
    entrypoint: ["python3", "-m", "src.control.openai_bridge"]

  # ── pgAdmin ──────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: graph-mcp-pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      - TZ=Europe/Istanbul
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@graphmcp.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - ${HOST_APP_ROOT}/data/pgadmin:/var/lib/pgadmin
    networks:
      - graphmcp-net
    depends_on:
      postgres:
        condition: service_healthy

  # ── RedisInsight ─────────────────────────────────────────────────────────
  redisinsight:
    image: redis/redisinsight:latest
    container_name: graph-mcp-redisinsight
    restart: unless-stopped
    environment:
      - TZ=Europe/Istanbul
    ports:
      - "127.0.0.1:15540:5540"
    volumes:
      - ${HOST_APP_ROOT}/data/redisinsight:/data
    networks:
      - graphmcp-net

  # ── Real-Time Log Viewer Dashboard ──────────────────────────────────────────
  log-viewer:
    build: .
    container_name: graph-mcp-log-viewer
    restart: unless-stopped
    ports:
      - "8080:8001"
    environment:
      - TZ=Europe/Istanbul
      - LOG_FILE=/app/data/graph-mcp.log
    volumes:
      - ${HOST_APP_ROOT}/src:/app/src
      - ${HOST_APP_ROOT}/data/graphmcp:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - graphmcp-net
    entrypoint: ["python3", "-m", "src.control.log_viewer"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8001'"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  graphmcp-net:
    driver: bridge

volumes:
  agent-workspaces:
    driver: local
