version: "3.9"

services:

  # ── Graph Database (Neo4j) ────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: graph-mcp-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/var/lib/neo4j/import
      - ./data/neo4j/plugins:/plugins
    networks:
      - graphmcp-net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Vektör Veritabanı ─────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: graph-mcp-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - graphmcp-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Embedding + Retrieval Cache ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: graph-mcp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - graphmcp-net
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Retrieval Logs (privacy-safe) ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: graph-mcp-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: graphmcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: graphmcp
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - graphmcp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphmcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── GraphMCP Sunucusu ─────────────────────────────────────────────────────
  graph-mcp:
    build: .
    container_name: graph-mcp
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - graphmcp-net
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: postgresql://graphmcp:${POSTGRES_PASSWORD}@postgres:5432/graphmcp
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      COLLECTION_NAME: ${COLLECTION_NAME:-codebase}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      DEFAULT_COLLECTION: ${DEFAULT_COLLECTION:-WareLogisticcBYS}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-openai/gpt-4o-mini}
      PROJECT_REGISTRY_PATH: /app/data/project_registry.json
      # OrbStack proxy'sini koru (dış API erişimi için) — ama NO_PROXY'deki
      # IPv6 CIDR'ı (fd07:b51a:cc66:f0::/64) httpx çökertiyor, temizlendi.
      # Docker iç servis hostname'leri de proxy'den muaf tutuldu.
      NO_PROXY: "localhost,127.0.0.1,127.0.0.0/8,::1,192.168.0.0/16,10.0.0.0/8,qdrant,neo4j,redis,postgres,graph-mcp-qdrant,graph-mcp-neo4j,graph-mcp-redis,graph-mcp-postgres"
      no_proxy: "localhost,127.0.0.1,127.0.0.0/8,::1,192.168.0.0/16,10.0.0.0/8,qdrant,neo4j,redis,postgres,graph-mcp-qdrant,graph-mcp-neo4j,graph-mcp-redis,graph-mcp-postgres"
    volumes:
      - /Volumes/MacBook/RiderProjects:/projects:ro
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./data/graphmcp:/app/data

  # ── pgAdmin ──────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: graph-mcp-pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@graphmcp.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    networks:
      - graphmcp-net
    depends_on:
      postgres:
        condition: service_healthy

  # ── RedisInsight ─────────────────────────────────────────────────────────
  redisinsight:
    image: redis/redisinsight:latest
    container_name: graph-mcp-redisinsight
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - ./data/redisinsight:/data
    networks:
      - graphmcp-net

networks:
  graphmcp-net:
    driver: bridge

volumes: {}
